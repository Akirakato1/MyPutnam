name: Validate content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/content/package-lock.json
      - name: Install content tools
        run: npm ci --prefix tools/content
      - name: Run complete content tests
        run: npm --prefix tools/content test
      - name: Build clean local publication
        run: npm --prefix tools/content run build:publication
      - name: Audit local publication
        run: npm --prefix tools/content run audit:publication

