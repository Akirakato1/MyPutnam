name: Publish content feed

on:
  workflow_dispatch:
    inputs:
      publication_mode:
        description: Publication rights mode
        required: true
        default: rights-cleared
        type: choice
        options:
          - rights-cleared
          - temporary-personal-public
      public_acknowledgement:
        description: For temporary-personal-public, enter exactly "I understand this temporary feed is public"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/content/package-lock.json
      - name: Install content tools
        run: npm ci --prefix tools/content
      - name: Run complete content tests
        run: npm --prefix tools/content test
      - name: Build clean publication
        run: npm --prefix tools/content run build:publication
      - name: Audit deployment policy and publication
        env:
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
          PUBLICATION_ACKNOWLEDGEMENT: ${{ inputs.public_acknowledgement }}
        run: npm --prefix tools/content run audit:deployment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/content-publication
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

