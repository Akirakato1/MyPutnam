<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 32px; color: #182335; background: white; font: 32px serif; line-height: 1.5; }
    .display { margin: 36px 0; text-align: center; font-size: 42px; }
    .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; }
    .fraction span:first-child { border-bottom: 2px solid currentColor; }
    .spacer { height: 1700px; border-left: 4px solid #4f6f9f; }
    .end-marker { display: inline-block; padding: 16px; color: white; background: #182335; }
  </style>
</head>
<body>
  <h1>Rendered mathematics</h1>
  <p>For every real <i>x</i>, consider the expression</p>
  <div class="display"><span class="fraction"><span>x<sup>2</sup> + 1</span><span>x - 1</span></span> = 0.</div>
  <div class="spacer"></div>
  <p class="end-marker">Continuation marker</p>
</body>
</html>
