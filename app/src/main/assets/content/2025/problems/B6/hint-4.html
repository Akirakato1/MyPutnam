  <main class="document"><ol><li>For large n, exponential growth gives g(n)≥n+2, so g(g(n))≥g(n+2).</li><li>Use the inequality at n and n+1 to bound g(n+2) both above by a power of g(n+1) and below exponentially in g(n+1).</li><li>A polynomial cannot dominate an exponential, yielding the contradiction.</li></ol></main>
