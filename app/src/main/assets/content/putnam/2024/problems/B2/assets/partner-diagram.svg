<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-labelledby="title desc">
  <title id="title">Partner quadrilaterals ABCD and ABCE</title>
  <desc id="desc">Points A and C lie on a horizontal diagonal. Its vertical perpendicular bisector reflects D to E. The quadrilaterals ABCD and ABCE share A, B, and C.</desc>
  <rect width="400" height="370" fill="#ffffff"/>
  <line x1="200" y1="24" x2="200" y2="292" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="210" y="38" font-family="sans-serif" font-size="15" fill="#475569">perpendicular bisector</text>
  <line x1="70" y1="240" x2="330" y2="240" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="70" y1="240" x2="230" y2="330" stroke="#111827" stroke-width="4"/>
  <line x1="230" y1="330" x2="330" y2="240" stroke="#111827" stroke-width="4"/>
  <line x1="70" y1="240" x2="290" y2="80" stroke="#2563eb" stroke-width="4"/>
  <line x1="290" y1="80" x2="330" y2="240" stroke="#2563eb" stroke-width="4"/>
  <line x1="70" y1="240" x2="110" y2="80" stroke="#b45309" stroke-width="4"/>
  <line x1="110" y1="80" x2="330" y2="240" stroke="#b45309" stroke-width="4"/>
  <g fill="#111827">
    <circle cx="70" cy="240" r="6"/><circle cx="230" cy="330" r="6"/><circle cx="330" cy="240" r="6"/>
    <circle cx="290" cy="80" r="6"/><circle cx="110" cy="80" r="6"/>
  </g>
  <g font-family="serif" font-size="24" font-style="italic" fill="#111827">
    <text x="45" y="253">A</text><text x="232" y="356">B</text><text x="340" y="253">C</text>
    <text x="301" y="76">D</text><text x="82" y="76">E</text>
  </g>
</svg>
