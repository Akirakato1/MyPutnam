<body>
  <main class="document"><p>Every nonnegative integer is a sum of distinct indexed Fibonacci numbers: subtract the largest Fibonacci number not exceeding the remainder and repeat. The new remainder is smaller than the preceding Fibonacci number, so no index is reused.</p></main>
